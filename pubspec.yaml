name: primero
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^15.1.1
  font_awesome_flutter: ^10.4.0
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.0.0 # 토큰, UUID 등 안전 저장
  dio: ^5.8.0+1
  image_picker: ^1.1.0
  uuid: ^4.3.3 # device_uuid 생성용
  retrofit: ^4.4.2          
  freezed_annotation: ^2.4.4
  shared_preferences: ^2.5.3
  barcode_widget: ^2.0.4
  package_info_plus: ^8.0.0
  lottie: ^3.1.2
  
  
  geolocator: ^14.0.1
  google_maps_flutter: ^2.12.2

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^8.1.0  # Retrofit 코드 생성기
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/RedHatDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/RedHatDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RedHatDisplay-Bold.ttf
          weight: 700
